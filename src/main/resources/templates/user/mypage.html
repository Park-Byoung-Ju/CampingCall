<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main.html}">
    
    <th:block layout:fragment="css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" href="/static/css/mypage.css">
	</th:block>
    
    <th:block layout:fragment="contents">
    <div class="w-100 p-2">
    	<div class="d-flex justify-content-between">
    		<div id="nameTitle" class="d-flex">
    			<div th:text="${name}" class="mr-2 font-weight-bold">???</div>님
    			
    			</div>
    		<div>점3개</div>
    	</div>
    	
    	<div class="border-box p-3 mt-3">
    		<div class="d-flex justify-content-between">
    			<div>계획</div>
    			<div class="link-text">+더보기</div>
    		</div>
    		
    		<hr>
    		
    		<div>
	    		<div class="d-flex p-2">
	    			<div>시간</div>
	    			<div>계획 목록</div>
	    		</div>
	    		
	    		<div class="d-flex p-2">
	    			<div>시간</div>
	    			<div>계획 목록</div>
	    		</div>
	    		
	    		<div class="d-flex p-2">
	    			<div>시간</div>
	    			<div>계획 목록</div>
	    		</div>
	    	</div>
    	</div>
    	
    	<hr>
    	
    	<div class="border-box p-3">
    		<div class="d-flex justify-content-between">
    			<div id="payTitle">결제 내역</div>
    			<div id="payList" class="link-text d-flex align-items-end">+더보기</div>
    		</div>
    		
    		<hr>
    		
    		<div>
    			<th:block th:if="${bookingList != null}">
	    			<th:block th:each="booking : ${bookingList}">
	    			<div class="d-flex p-2">
		    			<div>
		    				<img width=200 height=180 th:src="${booking.camp.firstImageUrl}">
		    			</div>
		    			<div class="p-2 w-100 ml-2 d-flex flex-column justify-content-between">
		    				<div class="campingPlace" th:text="${booking.camp.facltNm}">???캠핑장</div>
		    				
		    				<div class="pay-box d-flex flex-column justify-content-between">
		    					<div th:text="${booking.camp.campList.get(booking.campBooking.bookingNumber - 1)}"></div>
		    					<div class="d-flex"><div class="mr-2" th:text="${booking.campBooking.price}">???</div>원</div>
		    					<div class="d-flex">결제일 : <div class="ml-2" th:text="${#temporals.format(booking.campBooking.createdAt,'yyyy-MM-dd HH:mm')}"></div></div>
		    					<div class="d-flex">이용일 : <div class="ml-2" th:text="${booking.campBooking.date}"></div></div>
		    				</div>
		    			</div>
	    			</div>
	    			</th:block>
    			</th:block>
    			
    			<th:block th:unless="${bookingList != null}">
    				<div id="nullText" class="text-center">내역 없음</div>
    			</th:block>
    		</div>
    	</div>
    	
    </div>
    </th:block>
    
    <th:block layout:fragment="script">
    <script>
    $(document).ready(function(){
    	$("#payList").click(function(){
    		location.href = "/mypage/payList";
    	});
    });
    </script>
    </th:block>
</html>
