<!DOCTYPE html>
<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main.html}">
    
    <th:block layout:fragment="css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<link rel="stylesheet" href="/static/css/mainPage.css">
	</th:block>
    
    <th:block layout:fragment="contents">
	    <section class="w-100">
	    	<div id="imgWrap" class="col-12 d-flex justify-content-center">
	    			<div id="bannerBox">
	    				<img id="imgBanner" width=500 height=300 th:src="${bannerList.get(0).firstimage}" th:data-id="${bannerList.get(0).contentid}">
	    			</div>
	    			
	    			<div id="btnWrap" class="d-flex justify-content-between">
		    			<div id="prev" class="imgBtn bannerItem"><</div>
		    			<div class="bannerItem bannerTitle">
		    				<div id="BannerTitle" class="h-100 d-flex justify-content-center align-items-center" th:text="${bannerList.get(0).title}">행사명 최대 27글자</div>
		    			</div>
		    			<div id="next" class="imgBtn bannerItem">></div>
	    			</div>
	    	</div>
	    	
	    	<div class="d-flex justify-content-between mt-5">
	    		<div class="infoList">
	    			<div class="d-flex justify-content-between">
		    			<div class="list-title">캠핑장</div>
	    				<div class="d-flex align-items-center plus-list" data-ad="/camp/campList">더보기+</div>
	    			</div>
	    			
	    			<hr>
	    			
	    			<th:block th:each="camp : ${campList}">
		    			<div class="d-flex mt-3 clickPage camp" th:data-id="${camp.contentId}" th:data-title="${camp.facltNm}">
		    				<div class="col-4"><img class="w-100 listImg" th:src="${camp.firstImageUrl}"></div>
							<div class="col-8 titleFont" th:text="${camp.facltNm}"></div>
		    			</div>
	    			</th:block>
	    		</div>
	    		
	    		<div class="infoList">
	    			<div class="d-flex justify-content-between">
		    			<div class="list-title">관광지</div>
	    				<div class="d-flex align-items-center plus-list" data-ad="/trip/tripList">더보기+</div>
	    			</div>
	    			
	    			<hr>
	    			
	    			<th:block th:each="trip : ${tripList}">
		    			<div class="d-flex mt-3 clickPage trip" th:data-id="${trip.contentid}">
		    				<div class="col-4"><img class="w-100 listImg" th:src="${trip.firstimage}"></div>
		    				<div class="col-8 titleFont" th:text="${trip.title}"></div>
		    			</div>
	    			</th:block>
	    		</div>
	    		
	    	</div>
	    </section>
    </th:block>
    
    <th:block layout:fragment="script">
    <script th:inline="javascript">
    	var imgAd = /*[[${bannerList}]]*/ [];
    </script>
    
    <script>
    	var imgIndex = 0;
    	var imgLength = imgAd.length;
    	
    	$(window).on("load", function(){
    		let maxH = 0;
    		$(".listImg").each(function(index) {
        	    // index를 활용하여 다른 이미지를 순차적으로 적용
        	    let height = $(this).height();
        	    console	.log("height : " + height);
        	    
        	    if(height > maxH){
        	    	maxH = height;
        	    }
        	});
    		
    		$(".listImg").attr("height", maxH);
    	});
    	
    	$(".camp").click(function(){
    		let id = $(this).attr("data-id");
    		let keyword = $(this).attr("data-title");
    		location.href="/camp/detail?contentsId=" + id + "&keyword="+keyword;
    	});
    	
    	$(".trip").click(function(){
    		let id = $(this).attr("data-id");
    		location.href="/trip/detail/12/" + id;
    	});
    	
    	$("#imgBanner").click(function(){
    		let id = $("#imgBanner").attr("data-id");
    		location.href="/trip/detail/15/" + id;
    	});
 
    	function imgChange(){
    		$("#imgBanner").attr("src", imgAd[imgIndex].firstimage);
    		$("#BannerTitle").text(imgAd[imgIndex].title);
    		$("#imgBanner").attr("data-id", imgAd[imgIndex].contentid);
    	}
    	
    	$("#prev").click(function(){
    		imgIndex--;
    		
    		if(imgIndex < 0){
    			imgIndex = imgLength - 1;
    		}
    		
    		imgChange();
    	});
    	
    	$("#next").click(function(){
			imgIndex++;
    		
    		if(imgIndex >= imgLength){
    			imgIndex = 0;
    		}
    		
    		imgChange();
    	});
    	
    	setInterval(function(){
			imgIndex++;
    		
    		if(imgIndex >= imgLength){
    			imgIndex = 0;
    		}
    		
    		imgChange();
    	}, 3000);
    	
    	$(".plus-list").click(function(){
    		let address = $(this).attr("data-ad");
    		
    		location.href = address;
    	});
    	
    </script>
    </th:block>
</html>
